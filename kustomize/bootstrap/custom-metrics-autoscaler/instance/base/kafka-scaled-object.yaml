# See https://docs.openshift.com/container-platform/4.17/nodes/cma/nodes-cma-autoscaling-custom-trigger.html#nodes-cma-autoscaling-custom-trigger-kafka_nodes-cma-autoscaling-custom-trigger
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-scaled-object-parks-app
  namespace: parks-app
spec:
  cooldownPeriod: 20
  initialCooldownPeriod: 0
  pollingInterval: 1
  maxReplicaCount: 1
  minReplicaCount: 0
  scaleTargetRef:
    name: parks-app
  triggers:
    - metadata:
        activationLagThreshold: '4'
        offsetResetPolicy: earliest
        bootstrapServers: 'kafka-kafka-bootstrap.kafka.svc:9092'
        consumerGroup: parks
        topic: weather-warnings
      type: kafka
