---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operator-kafka
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    has-git-repo-objects: "true"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: ''
      targetRevision: ''
      path: kustomize/bootstrap/kafka/operator/base
  project: default
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true