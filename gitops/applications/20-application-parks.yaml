# This is done via Helm in ArgoCD so just point to the root
# It sees Chart.yaml and values.yaml and templates folder and it figure it out on its own
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-parks-weather
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    has-git-repo-objects: "true"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: ''
      targetRevision: ''
      path: ./
  project: default
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true