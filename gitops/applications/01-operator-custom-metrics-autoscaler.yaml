---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operator-custom-metrics-autoscaler
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    has-git-repo-objects: "true"
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: ''
      targetRevision: ''
      path: kustomize/bootstrap/custom-metrics-autoscaler/operator/overlays/stable
      #directory:
      #  recurse: true
      # kustomize:
      #   version: v5.1.0
  project: default
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      # selfHeal: false # overrides changes made on the cluster that drift from git state