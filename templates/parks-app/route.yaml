kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: parks-app
  labels:
    app: parks-app
    app.kubernetes.io/component: parks-app
    app.kubernetes.io/name: parks-app
    app.kubernetes.io/part-of: parks
spec:
  to:
    kind: Service
    name: parks-app
    weight: 100
  port:
    targetPort: {{ $.Values.service.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None