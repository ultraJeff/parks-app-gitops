kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: parks-app
  labels:
    {{- include "parks-app.labels" $ | nindent 4 }}
spec:
  to:
    kind: Service
    name: parks-app
    weight: 100
  port:
    targetPort: {{ $.Values.service.port }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None